# Overrides for k3s's bundled Traefik chart, applied via k3s's helm-controller.
# Safe to apply before Traefik is enabled (helm-controller just holds onto it
# until the `traefik` HelmChart actually exists).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # api.insecure was dropped: the dashboard is served via the IngressRoute in
    # traefik-dashboard.yaml behind lan-only + basicAuth instead.
    additionalArguments: []
    service:
      spec:
        # Preserve real client source IPs so the lan-only ipAllowList is meaningful.
        externalTrafficPolicy: Local
