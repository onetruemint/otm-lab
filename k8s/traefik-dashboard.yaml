# Requires Traefik's own CRDs (Middleware, IngressRoute) to exist — apply this
# only after k3s's Traefik is enabled and running (step 4 of the cutover), not
# before. These give traefik.mint its dashboard and pihole.mint its redirect,
# matching what Compose's Traefik did.
---
# LAN-only gate applied to every Ingress (annotation
# traefik.ingress.kubernetes.io/router.middlewares: homelab-lan-only@kubernetescrd).
# Pod CIDR is deliberately NOT allowed: if Traefik saw pod IPs the gate would be
# fail-open. traefik-config.yaml sets externalTrafficPolicy: Local so Traefik sees
# real client IPs.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: homelab
spec:
  ipAllowList:
    sourceRange:
      - 192.168.50.0/24
      - 127.0.0.1/32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pihole-redirect
  namespace: homelab
spec:
  redirectRegex:
    regex: ^http://pihole.mint/?$
    replacement: http://pihole.mint/admin
---
# The dashboard/api backend (api@internal) doesn't redirect bare `/` to
# `/dashboard/` itself on this entrypoint — that auto-redirect is a feature of
# Traefik's dedicated internal admin port, which isn't what's exposed here.
# Reproduce it explicitly.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-redirect
  namespace: kube-system
spec:
  redirectRegex:
    regex: ^http://traefik.mint/?$
    replacement: http://traefik.mint/dashboard/
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: kube-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`traefik.mint`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      priority: 10
      middlewares:
        - name: lan-only
        - name: dashboard-auth
      services:
        - name: api@internal
          kind: TraefikService
    - match: Host(`traefik.mint`)
      kind: Rule
      priority: 1
      middlewares:
        - name: lan-only
        - name: traefik-dashboard-redirect
      services:
        - name: api@internal
          kind: TraefikService
---
# Same gate for the dashboard, which lives in kube-system (middleware refs are namespaced).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: kube-system
spec:
  ipAllowList:
    sourceRange:
      - 192.168.50.0/24
      - 127.0.0.1/32
---
# Credentials come from Secret `traefik-dashboard-auth` (key `users`, htpasswd format),
# created out of band and never committed:
#   (umask 077; printf 'admin:%s\n' "$(openssl passwd -apr1)" > ~/.dash-users)
#   sudo k3s kubectl -n kube-system create secret generic traefik-dashboard-auth \
#     --from-file=users=$HOME/.dash-users; rm -f ~/.dash-users
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-auth
  namespace: kube-system
spec:
  basicAuth:
    secret: traefik-dashboard-auth
