---
# pihole stays on Compose; bridge to its new host-published web-UI port (8089).
apiVersion: v1
kind: Service
metadata:
  name: pihole-ext
  namespace: homelab
spec:
  ports:
    - port: 8089
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pihole-ext
  namespace: homelab
  labels:
    kubernetes.io/service-name: pihole-ext
addressType: IPv4
ports:
  - port: 8089
endpoints:
  - addresses:
      - 192.168.50.247
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole
  namespace: homelab
  annotations:
    # The pihole-redirect Middleware CRD is created separately, after Traefik's
    # own chart (and its CRDs) exist — see k8s/traefik-config.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: homelab-lan-only@kubernetescrd,homelab-pihole-redirect@kubernetescrd
spec:
  rules:
    - host: pihole.mint
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pihole-ext
                port:
                  number: 8089
---
