# Routes *.mint hostnames through k3s's own Traefik (the only ingress controller
# once Compose's Traefik is retired). Backends still on Compose/Podman are bridged
# in via selector-less Services + manually maintained EndpointSlices pointing at
# their host-published port on the node's LAN IP — the standard k8s pattern for
# routing cluster-internal traffic to something outside the cluster.
---
# metube's Service already exists (k8s/metube.yaml, type NodePort) — just add an
# Ingress pointing at it, don't redefine the Service here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metube
  namespace: homelab
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homelab-lan-only@kubernetescrd
spec:
  rules:
    - host: ytmp3.mint
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metube
                port:
                  number: 8081
---
# ollama stays on Compose; bridge to its host-published port.
apiVersion: v1
kind: Service
metadata:
  name: ollama-ext
  namespace: homelab
spec:
  ports:
    - port: 11434
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama-ext
  namespace: homelab
  labels:
    kubernetes.io/service-name: ollama-ext
addressType: IPv4
ports:
  - port: 11434
endpoints:
  - addresses:
      - 192.168.50.247
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama
  namespace: homelab
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homelab-lan-only@kubernetescrd
spec:
  rules:
    - host: ollama.mint
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollama-ext
                port:
                  number: 11434
---
